import groovy.json.JsonSlurper
import java.security.MessageDigest

plugins { id 'com.android.application' }

android {
    namespace 'ro.atf.holdem.android'
    compileSdk 36
    signingConfigs {
        holdemRelease {
            storeFile rootProject.file(System.getenv('HOLDEM_STORE_FILE') ?: 'build/holdem-release-missing.p12')
            storeType 'PKCS12'
            storePassword System.getenv('HOLDEM_STORE_PASSWORD') ?: ''
            keyAlias 'holdem-lab-release'
            keyPassword System.getenv('HOLDEM_STORE_PASSWORD') ?: ''
        }
    }
    defaultConfig {
        applicationId 'ro.atf.holdem.android'
        minSdk 26
        targetSdk 36
        versionCode 3
        versionName '0.1.0'
        testApplicationId 'ro.atf.holdem.android.test'
        testInstrumentationRunner 'ro.atf.holdem.android.TournamentSanity'
    }
    testBuildType 'sanity'
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    bundle {
        language {
            enableSplit = false
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.holdemRelease
            debuggable false
        }
        sanity {
            initWith release
            debuggable true
        }
    }
}

def verifyLanguageBundlePolicy = tasks.register('verifyLanguageBundlePolicy') {
    doLast {
        if (android.bundle.language.enableSplit != false) {
            throw new GradleException('The in-app language picker requires English and Romanian resources in every install.')
        }
    }
}
tasks.named('preBuild') { dependsOn verifyLanguageBundlePolicy }

def verifyHoldemReleaseSigning = tasks.register('verifyHoldemReleaseSigning') {
    doLast {
        def storePath = System.getenv('HOLDEM_STORE_FILE')
        def password = System.getenv('HOLDEM_STORE_PASSWORD')
        if (!storePath || !password || !rootProject.file(storePath).isFile()) {
            throw new GradleException('A private, persistent J6 release signing identity is required.')
        }
    }
}
tasks.matching { it.name in ['packageRelease', 'packageSanity', 'signReleaseBundle', 'signSanityBundle'] }.configureEach {
    dependsOn verifyHoldemReleaseSigning
}

def cardUi = 'ro.cardtable:card-table-ui:0.1.7'
def cardNames = 'ro.cardtable:card-table-names:0.1.0'
def uiLibrary = rootProject.layout.projectDirectory.dir('ui-library')

dependencies {
    implementation project(':engine')
    implementation cardUi
    implementation cardNames
    testImplementation 'junit:junit:4.13.2'
}

def verifyCardTable = tasks.register('verifyCardTable') {
    inputs.dir(uiLibrary)
    inputs.property('coordinates', [cardUi, cardNames])
    doLast {
        def manifest = new JsonSlurper().parse(uiLibrary.file('provenance.json').asFile)
        if (manifest.producer != 'atf_j4' || [manifest.coordinate, manifest.namesCoordinate] != [cardUi, cardNames]) {
            throw new GradleException('Card Table producer or version differs from the admitted manifest')
        }
        def expected = [cardUi, cardNames].collectMany { coordinate ->
            def (group, name, version) = coordinate.split(':')
            def base = "${group.replace('.', '/')}/${name}/${version}/${name}-${version}"
            [name == 'card-table-ui' ? '.aar' : '.jar', '.pom', '.module', '-sources.jar'].collect {
                (base + it).toString()
            }
        }.toSet()
        if (manifest.files.size() != expected.size() || manifest.files*.path.toSet() != expected) {
            throw new GradleException('Card Table manifest must cover all admitted files exactly once')
        }
        manifest.files.each { entry ->
            def bytes = uiLibrary.file(entry.path).asFile.bytes
            def actual = MessageDigest.getInstance('SHA-256').digest(bytes).encodeHex().toString()
            if (actual != entry.sha256) throw new GradleException("Card Table checksum mismatch: ${entry.path}")
        }
    }
}
tasks.named('preBuild') { dependsOn verifyCardTable }
