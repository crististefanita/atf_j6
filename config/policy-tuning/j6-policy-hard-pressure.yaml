schemaVersion: 1
project: atf-j6-holdem-lab
domain: no-limit-texas-holdem
runtime: jvm-21
mobile: excluded-from-phase-1
online:
  supportedMode: explicitly-authorized-bot-platform-only
  defaultAdapter: open-poker-websocket-v2
  realMoneyAutomation: prohibited
secrets:
  source: environment-or-os-credential-store
  sourceControl: forbidden
evaluation:
  publicDecisionInput: actor-observation-only
  hiddenOpponentCardsInPolicy: forbidden
  required: [seed, policyVersion, replay, independent-legality-check]
bluff:
  frequencyPercent: 18
  latePositionWindow: 2
looseAggressive:
  openFrequencyPercent: 45
  raiseFrequencyPercent: 20
  maxCallPotPercent: 35
  betPotPercent: 0
  latePositionAdjustmentPercent: 10
equityDecision:
  samples: 512
  cashCallMarginPercent: 2
  tournamentCallMarginPercent: 8
  raiseEdgePercent: 18
  valueBetThresholdPercent: 60
  contextWeights:
    extraOpponentCallMargin: 3
    opponentAggressionCallMargin: 3
    raiseMarginPerExtraOpponent: 2
    extraOpponentValueBetMargin: 5
    earlyPositionCallMargin: 2
    latePositionCallDiscount: 2
    earlyPositionValueBetMargin: 3
    latePositionValueBetDiscount: 3
    opponentAggressionValueBetMargin: 2
    tournamentValueBetMargin: 2
    uncertaintyZHundredths: 164
    largeBetCallMargin: 3
    opponentAllInCallMargin: 6
    tournamentEliminationRiskMargin: 8
    tournamentShortStackCallDiscount: 5
    tournamentCommitmentThresholdPercent: 75
    shortStackShovePriorProbabilityPercent: 10
    shortStackShovePriorOpportunities: 10
    shortStackShoveWarmupOpportunities: 3
    shortStackShoveSensitivity: 16
    shortStackShoveMaxMarginAdjustment: 4
hardPressure:
  bigBlindValueRaise: false
  # Reducere maximă pentru call-ul preflop de cel mult două blinduri mari.
  cheapPreflopDiscount: 3
  # Profilurile de evaluare pot adăuga responseModel și pot izola ponderile foldWeight și raiseWeight.
  # Profilurile de laborator pot adăuga raiseEv cu potPercents și responseModel fără ponderi de prag.
  # Varianta raiseEv.nearby folosește perechi proprii și se califică separat pe FIRST_RAISE sau RERAISE.
  fullPotEquity: 76
  doublePotEquity: 86
  triplePotEquity: 94
  raiseContext:
    baseMargin: 8
    multiwayMargin: 5
    positionMargin: 2
    aggressionMargin: 3
    largeBetMargin: 3
    allInMargin: 6
    commitmentMargin: 8
    commitmentThresholdPercent: 75
