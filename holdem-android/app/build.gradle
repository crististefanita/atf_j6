import groovy.json.JsonSlurper
import groovy.json.JsonOutput
import java.security.MessageDigest

plugins { id 'com.android.application' }

android {
    namespace 'ro.atf.holdem.android'
    compileSdk 36
    signingConfigs {
        holdemRelease {
            storeFile rootProject.file(System.getenv('HOLDEM_STORE_FILE') ?: 'build/holdem-release-missing.p12')
            storeType 'PKCS12'
            storePassword System.getenv('HOLDEM_STORE_PASSWORD') ?: ''
            keyAlias 'holdem-lab-release'
            keyPassword System.getenv('HOLDEM_STORE_PASSWORD') ?: ''
        }
    }
    defaultConfig {
        applicationId 'ro.atf.holdem.android'
        minSdk 26
        targetSdk 36
        versionCode 29
        versionName '0.18.0'
        testApplicationId 'ro.atf.holdem.android.test'
        testInstrumentationRunner 'ro.atf.holdem.android.TournamentSanity'
    }
    testBuildType 'sanity'
    sourceSets {
        test.java.srcDir 'src/testSupport/java'
        androidTest.java.srcDir 'src/testSupport/java'
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    bundle {
        language {
            enableSplit = false
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.holdemRelease
            debuggable false
        }
        sanity {
            initWith release
            debuggable true
        }
    }
}


abstract class GenerateGameplayAchievementCatalog extends DefaultTask {
    @InputFile
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract RegularFileProperty getRulesFile()

    @OutputDirectory
    abstract DirectoryProperty getOutputDirectory()

    @TaskAction
    void generate() {
        // The project uses the JSON subset of YAML for this shared Android and Node catalog.
        def catalog = new JsonSlurper().parse(rulesFile.get().asFile)
        def tiers = ['EASY', 'MEDIUM', 'HARD']
        if (catalog.keySet() != ['schemaVersion', 'tiers', 'retired'].toSet() || catalog.schemaVersion != 1 ||
                catalog.tiers.keySet() != tiers.toSet()) {
            throw new GradleException('Invalid achievement catalog schema or tier set')
        }
        def ids = [] as Set
        def labels = [] as Set
        def rules = [] as Set
        if (!(catalog.retired instanceof List)) throw new GradleException('Retired achievement inventory is missing')
        catalog.retired.each { row ->
            if (row.keySet() != ['id', 'metric', 'target', 'label', 'reason'].toSet() ||
                    !(row.id ==~ /[a-z][a-z0-9-]*/) || !(row.metric ==~ /[A-Z][A-Z0-9_]*/) ||
                    !(row.target instanceof Integer) || row.target < 1 ||
                    !(row.label ==~ /(plurals\/)?gameplay_achievement_[a-z0-9_]+/) ||
                    !(row.reason instanceof String) || row.reason.isBlank() || !ids.add(row.id) || !labels.add(row.label)) {
                throw new GradleException("Invalid retired achievement: $row")
            }
        }
        def cases = tiers.collect { tier ->
            def milestones = catalog.tiers[tier]
            if (!(milestones instanceof List) || milestones.isEmpty()) {
                throw new GradleException("Invalid achievement count for $tier")
            }
            def entries = milestones.collect { row ->
                if (row.keySet() != ['id', 'metric', 'target', 'label', 'ruleRo', 'ruleEn'].toSet() ||
                        !(row.id ==~ /[a-z][a-z0-9-]*/) || !(row.metric ==~ /[A-Z][A-Z0-9_]*/) ||
                        !(row.target instanceof Integer) || row.target < 1 ||
                        !(row.label ==~ /(plurals\/)?gameplay_achievement_[a-z0-9_]+/) ||
                        ![row.ruleRo, row.ruleEn].every { it instanceof String && !it.isBlank() && it.contains('{target}') == (row.target > 1) } ||
                        !ids.add(row.id) || !labels.add(row.label) ||
                        !rules.add([row.metric, row.target])) {
                    throw new GradleException("Invalid or duplicate achievement in $tier: $row")
                }
                def plural = row.label.startsWith('plurals/')
                def resource = plural ? row.label.replace('/', '.') : "string.$row.label"
                "new Milestone(\"$row.id\", Metric.$row.metric, $row.target, R.$resource, $plural, ${JsonOutput.toJson(row.ruleRo)}, ${JsonOutput.toJson(row.ruleEn)})"
            }
            "            case $tier -> List.of(\n                    " + entries.join(',\n                    ') + ');'
        }.join('\n')
        def file = outputDirectory.get().file('ro/atf/holdem/android/GameplayAchievementCatalogData.java').asFile
        file.parentFile.mkdirs()
        file.setText("""package ro.atf.holdem.android;

import java.util.List;
import ro.atf.holdem.android.GameplayAchievementCatalog.Milestone;
import ro.atf.holdem.android.GameplayAchievements.Metric;

final class GameplayAchievementCatalogData {
    private GameplayAchievementCatalogData() {}

    static List<Milestone> forTier(GameplayAchievementCatalog.Tier tier) {
        return switch (tier) {
$cases
        };
    }
}
""", 'UTF-8')
    }
}
def generateGameplayAchievementCatalog = tasks.register('generateGameplayAchievementCatalog', GenerateGameplayAchievementCatalog) {
    rulesFile.set(rootProject.file('../config/j6-achievements.yaml'))
    outputDirectory.set(layout.buildDirectory.dir('generated/sources/gameplayAchievements/java'))
}
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.java.addGeneratedSourceDirectory(generateGameplayAchievementCatalog) { it.outputDirectory }
    }
}

def verifyLanguageBundlePolicy = tasks.register('verifyLanguageBundlePolicy') {
    doLast {
        if (android.bundle.language.enableSplit != false) {
            throw new GradleException('The in-app language picker requires English and Romanian resources in every install.')
        }
    }
}
tasks.named('preBuild') { dependsOn verifyLanguageBundlePolicy }

def verifyHoldemReleaseSigning = tasks.register('verifyHoldemReleaseSigning') {
    doLast {
        def storePath = System.getenv('HOLDEM_STORE_FILE')
        def password = System.getenv('HOLDEM_STORE_PASSWORD')
        if (!storePath || !password || !rootProject.file(storePath).isFile()) {
            throw new GradleException('A private, persistent J6 release signing identity is required.')
        }
    }
}
tasks.matching { it.name in ['packageRelease', 'packageSanity', 'signReleaseBundle', 'signSanityBundle'] }.configureEach {
    dependsOn verifyHoldemReleaseSigning
}

def cardUi = 'ro.cardtable:card-table-ui:0.1.10'
def cardNames = 'ro.cardtable:card-table-names:0.1.0'
def uiLibrary = rootProject.layout.projectDirectory.dir('ui-library')

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation project(':engine')
    implementation cardUi
    implementation cardNames
    testImplementation 'junit:junit:4.13.2'
}

def verifyCardTable = tasks.register('verifyCardTable') {
    inputs.dir(uiLibrary)
    inputs.property('coordinates', [cardUi, cardNames])
    doLast {
        def manifest = new JsonSlurper().parse(uiLibrary.file('provenance.json').asFile)
        if (manifest.producer != 'atf_j4' || [manifest.coordinate, manifest.namesCoordinate] != [cardUi, cardNames]) {
            throw new GradleException('Card Table producer or version differs from the admitted manifest')
        }
        def expected = [cardUi, cardNames].collectMany { coordinate ->
            def (group, name, version) = coordinate.split(':')
            def base = "${group.replace('.', '/')}/${name}/${version}/${name}-${version}"
            [name == 'card-table-ui' ? '.aar' : '.jar', '.pom', '.module', '-sources.jar'].collect {
                (base + it).toString()
            }
        }.toSet()
        if (manifest.files.size() != expected.size() || manifest.files*.path.toSet() != expected) {
            throw new GradleException('Card Table manifest must cover all admitted files exactly once')
        }
        manifest.files.each { entry ->
            def bytes = uiLibrary.file(entry.path).asFile.bytes
            def actual = MessageDigest.getInstance('SHA-256').digest(bytes).encodeHex().toString()
            if (actual != entry.sha256) throw new GradleException("Card Table checksum mismatch: ${entry.path}")
        }
    }
}
tasks.named('preBuild') { dependsOn verifyCardTable }
